<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>SIMPUS Mini | Tambah Buku</title>
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li> <!-- Latihan 1: Melengkapi Navigasi -->
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Buku</h2>
            <form action="">
                <p>
                    <label for="judul">Judul</label>
                    <input type="text" id="judul" name="judul" required placeholder="Masukkan Nama Judul">
                </p>
                <p>
                    <label for="pengarang">Pengarang</label>
                    <input type="text" id="pengarang" name="pengarang" required placeholder="Masukkan Nama Pengarang">
                </p>
                <p>
                    <label for="tahun">Tahun Terbit</label>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required placeholder="Masukkan Tahun Terbit">
                </p>
                <p>
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" placeholder="Masukkan ISBN">
                </p>
                <p>
                    <label for="stok">Stok</label>
                    <input type="number" id="stok" name="stok" min="0" required placeholder="Masukkan Stok">
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select name="kategori" id="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
</body>
</html>
